<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сокращатель ссылок</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Сокращатель ссылок</h1>
        <p class="subtitle">Быстро создавайте короткие ссылки и делитесь ими.</p>
        <form id="shorten-form" class="form">
          <label class="label" for="url-input">Введите длинный URL</label>
          <div class="input-row">
            <input
              id="url-input"
              name="url"
              type="url"
              placeholder="https://example.com"
              required
              autocomplete="off"
            />
            <button type="submit">Сократить</button>
          </div>
        </form>
        <div id="result" class="result hidden">
          <span>Короткая ссылка:</span>
          <a id="short-url" href="#" target="_blank" rel="noreferrer"></a>
          <button id="copy-btn" type="button">Скопировать</button>
        </div>
        <p id="error" class="error hidden"></p>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
